name: ci

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features --offline -- -D warnings
      - name: Test
        run: cargo test --workspace --offline
      - name: Evaluate
        run: cargo run --release -p agentos-cli --offline -- evaluate
      - name: Evaluate end to end
        run: cargo run --release -p agentos-cli --offline -- evaluate e2e

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Plugin layout
        run: sh install/tests/plugin_layout.sh
      - name: Installer
        run: sh install/tests/run.sh
      - name: Bootstrap
        run: sh install/tests/bootstrap.sh
      - name: Skills CLI discovers canonical skills
        run: npx --yes skills@latest add "$GITHUB_WORKSPACE" -l | tee /tmp/skills-list.txt
      - name: Skills CLI lists setup-agentos
        run: grep -q setup-agentos /tmp/skills-list.txt
