[workspace]
resolver = "3"
members = [
    "crates/agentos-cli",
    "crates/agentos-core",
    "crates/agentos-config",
    "crates/agentos-knowledge",
    "crates/agentos-context",
    "crates/agentos-skills",
    "crates/agentos-workflow",
    "crates/agentos-memory",
    "crates/agentos-feedback",
    "crates/agentos-evaluation",
    "crates/agentos-permissions",
    "crates/agentos-tools",
    "crates/agentos-adapters/generic",
    "crates/agentos-adapters/cursor",
    "crates/agentos-adapters/claude",
    "crates/agentos-adapters/codex",
    "crates/agentos-testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
agentos-core = { path = "crates/agentos-core" }
agentos-config = { path = "crates/agentos-config" }
agentos-testkit = { path = "crates/agentos-testkit" }

anyhow = "1.0.104"
assert_cmd = "2.2.2"
clap = { version = "4.6.7", features = ["derive"] }
predicates = "3.1.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.7"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
