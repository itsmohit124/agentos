[package]
name = "agentos-tools"
description = "AgentOS tool and capability abstractions."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Optional Node helper. The default build does not compile it and does not need Node.
playwright = ["dep:serde", "dep:serde_json"]

[dependencies]
agentos-permissions.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true

[[example]]
name = "playwright_smoke"
required-features = ["playwright"]

[lints]
workspace = true
